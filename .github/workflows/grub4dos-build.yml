name: grub4dos-build(发布release成功)

on:
  # 手动触发（关键！）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可选，留空自动生成）'
        required: false
        default: ''
      use_qemu:
        description: '使用 QEMU 测试'
        type: boolean
        default: true

jobs:
  build-push:
    runs-on: ubuntu-22.04
    steps:
    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full zip
        
    - uses: actions/checkout@v4
      with:
        fetch-depth: 10
        
    - name: 检出 iPXE (0.4.6分支)
      if: ${{ contains(github.ref, '0.4.6') }}
      uses: actions/checkout@v4
      with:
        repository: ipxe/ipxe
        path: ipxe
        ref: v1.21.1
        
    - name: 编译 GRUB4DOS
      uses: yaya2007/grub4dos-build@main
      with:
        useQemu: ${{ github.event.inputs.use_qemu || '1' }}
        
    - name: 打包发布版本
      id: package
      run: |
        # 确定版本号
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VER="${{ github.event.inputs.version }}"
        else
          VER="0.4.6a-$(date +%Y%m%d)-${GITHUB_SHA:0:8}"
        fi
        
        echo "VER=$VER" >> $GITHUB_OUTPUT
        echo "GRUB4DOS_VER=$VER" >> $GITHUB_ENV
        
        # 创建目录并复制文件
        PKG_DIR="grub4dos-${VER}"
        mkdir -p ${PKG_DIR}
        
        cp -v grldr grldr.mbr ${PKG_DIR}/ 2>/dev/null || true
        cp -v *.efi *.bin ${PKG_DIR}/ 2>/dev/null || true
        cp -v *.lst README* CHANGELOG* ${PKG_DIR}/ 2>/dev/null || true
        
        # 版本信息
        cat > ${PKG_DIR}/VERSION.txt << EOF
        GRUB4DOS ${VER}
        Build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        Commit: ${{ github.sha }}
        Branch: ${{ github.ref_name }}
        Trigger: ${{ github.event_name }}
        EOF
        
        # 创建压缩包
        7z a -t7z -mx=9 ${PKG_DIR}.7z ${PKG_DIR}/
        zip -r ${PKG_DIR}.zip ${PKG_DIR}/
        tar -cJf ${PKG_DIR}.tar.xz ${PKG_DIR}/
        
        # 校验和
        sha256sum ${PKG_DIR}.7z ${PKG_DIR}.zip ${PKG_DIR}.tar.xz > SHA256SUMS.txt
        
        echo "打包完成："
        ls -lh ${PKG_DIR}.*
        
    - name: 上传 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: grub4dos-${{ steps.package.outputs.VER }}
        path: |
          *.7z
          *.zip
          *.tar.xz
          SHA256SUMS.txt
        retention-days: 90

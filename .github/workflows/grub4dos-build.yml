name: grub4dos-build

on:
  push:
    branches: [ "master", "efi", "0.4.6a" ]
    tags: [ "v*" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可选，留空自动生成）'
        required: false
        default: ''
      use_qemu:
        description: '使用 QEMU 测试'
        type: boolean
        default: true
      publish:
        description: '发布到 Releases'
        type: boolean
        default: false

jobs:
  build:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    steps:
    - name: 安装依赖
      run: sudo apt -y install p7zip-full
        
    - name: 检出代码
      uses: actions/checkout@v3
      with:
        fetch-depth: 10
        
    - name: 下载 ipxe 源码
      if: ${{ contains(github.ref, '0.4.6') }}
      uses: actions/checkout@v3
      with:
        repository: ipxe/ipxe
        path: ipxe
        ref: v1.21.1

    - name: 编译
      uses: yaya2007/grub4dos-build@main
      with:
        useQemu: ${{ github.event.inputs.use_qemu || '1' }}
        
    - name: 生成版本号
      id: version
      run: |
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VER="${{ github.event.inputs.version }}"
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VER=${GITHUB_REF#refs/tags/}
        else
          VER="0.4.6a-$(date +%Y%m%d)-${GITHUB_SHA:0:8}"
        fi
        echo "VER=$VER" >> $GITHUB_OUTPUT
        
    - name: 发布到 GitHub Releases
      if: ${{ github.event.inputs.publish == 'true' || startsWith(github.ref, 'refs/tags/v') }}
      continue-on-error: true
      run: |
        VER="${{ steps.version.outputs.VER }}"
        
        # 查找编译生成的压缩包
        if ls *.7z 2>/dev/null; then
          if gh release view "$VER" &>/dev/null; then
            gh release upload "$VER" *.7z --clobber
          else
            gh release create "$VER" \
              --title "GRUB4DOS $VER" \
              --notes "构建版本: ${{ github.sha }}" \
              *.7z
          fi
        else
          echo "未找到压缩包"
          exit 1
        fi
      env:
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        
    - name: 上传 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: grub4dos-${{ steps.version.outputs.VER }}
        path: |
          *.7z
        if-no-files-found: error
        retention-days: 90

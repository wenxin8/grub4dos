name: grub4dos-build

on:
  # 自动触发：代码推送
  push:
    branches: [ "master","efi","0.4.6a" ]
    tags: [ "v*" ]
  
  # 自动触发：PR 事件
  pull_request:
    types: [ opened , synchronize , reopened ]
  
  # 手动触发（关键！）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可选，留空自动生成）'
        required: false
        default: ''
      use_qemu:
        description: '使用 QEMU 测试'
        type: boolean
        default: true

jobs:
  build-push:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    environment:
      name: PAGES
    steps:
    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full zip
        
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 10
        
    - name: 检出 iPXE (0.4.6分支)
      if: ${{ contains(github.ref, '0.4.6') }}
      uses: actions/checkout@v4
      with:
        repository: ipxe/ipxe
        path: ipxe
        ref: v1.21.1

    - name: Build iPXE
      working-directory: ipxe/src
      env:
        NO_WERROR: 1                    # iPXE 特定变量
        CFLAGS: "-Wno-maybe-uninitialized"
      run: |
        make -j$(nproc) bin/ipxe.lkrn bin/ipxe.usb NO_WERROR=1

    - name: 编译 GRUB4DOS
      uses: yaya2007/grub4dos-build@main
      with:
        useQemu: ${{ github.event.inputs.use_qemu || '1' }}
        
    - name: 打包发布版本
      id: package
      run: |
        # 确定版本号
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VER="${{ github.event.inputs.version }}"
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VER=${GITHUB_REF#refs/tags/}
        else
          VER="0.4.6a-$(date +%Y%m%d)-${GITHUB_SHA:0:8}"
        fi
        
        echo "VER=$VER" >> $GITHUB_OUTPUT
        echo "GRUB4DOS_VER=$VER" >> $GITHUB_ENV
        
        # 创建目录并复制文件
        PKG_DIR="grub4dos-${VER}"
        mkdir -p ${PKG_DIR}
        
        cp -v grldr grldr.mbr ${PKG_DIR}/ 2>/dev/null || true
        cp -v *.efi *.bin ${PKG_DIR}/ 2>/dev/null || true
        cp -v *.lst README* CHANGELOG* ${PKG_DIR}/ 2>/dev/null || true
        
        # 版本信息
        cat > ${PKG_DIR}/VERSION.txt << EOF
        GRUB4DOS ${VER}
        Build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        Commit: ${{ github.sha }}
        Branch: ${{ github.ref_name }}
        Trigger: ${{ github.event_name }}
        EOF
        
        # 创建 7z 压缩包
        7z a -t7z -mx=9 ${PKG_DIR}.7z ${PKG_DIR}/
        
        echo "打包完成："
        ls -lh ${PKG_DIR}.7z
        
    - name: 发布到 GitHub Releases
      continue-on-error: true
      run: |
        VER="${{ steps.package.outputs.VER }}"
        
        if gh release view "$VER" &>/dev/null; then
          gh release upload "$VER" *.7z *.zip --clobber
        else
          gh release create "$VER" \
            --title "GRUB4DOS $VER" \
            --notes "构建版本: ${{ github.sha }}" \
            *.7z *.zip
        fi
      env:
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        
    - name: 上传 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: grub4dos-${{ steps.package.outputs.VER }}
        path: |
          *.7z
          *.zip
          *.tar.xz
          SHA256SUMS.txt
        if-no-files-found: error
        retention-days: 90

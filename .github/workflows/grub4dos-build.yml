name: grub4dos-build(发布release成功)

on:
  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（必填，如：0.4.6a-20260328）'
        required: true
        default: ''
      branch:
        description: '要构建的分支'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - efi
          - 0.4.6a
      use_qemu:
        description: '使用 QEMU 测试'
        type: boolean
        default: true

jobs:
  build-release:
    runs-on: ubuntu-22.04
    environment:
      name: PAGES
    
    steps:
    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full zip
        
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch }}
        fetch-depth: 10
        
    - name: 检出 iPXE (0.4.6分支)
      if: ${{ github.event.inputs.branch == '0.4.6a' }}
      uses: actions/checkout@v4
      with:
        repository: ipxe/ipxe
        path: ipxe
        ref: v1.21.1
        
    - name: 编译 GRUB4DOS
      uses: yaya2007/grub4dos-build@main
      with:
        useQemu: ${{ github.event.inputs.use_qemu || '1' }}
        
    - name: 打包发布版本
      id: package
      run: |
        # 使用手动输入的版本号
        VER="${{ github.event.inputs.version }}"
        
        if [ -z "$VER" ]; then
          echo "错误：版本号不能为空"
          exit 1
        fi
        
        echo "VER=$VER" >> $GITHUB_OUTPUT
        echo "GRUB4DOS_VER=$VER" >> $GITHUB_ENV
        
        # 创建目录并复制文件
        PKG_DIR="grub4dos-${VER}"
        mkdir -p ${PKG_DIR}
        
        cp -v grldr grldr.mbr ${PKG_DIR}/ 2>/dev/null || true
        cp -v *.efi *.bin ${PKG_DIR}/ 2>/dev/null || true
        cp -v *.lst README* CHANGELOG* ${PKG_DIR}/ 2>/dev/null || true
        
        # 版本信息
        cat > ${PKG_DIR}/VERSION.txt << EOF
        GRUB4DOS ${VER}
        Build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        Commit: ${{ github.sha }}
        Branch: ${{ github.event.inputs.branch }}
        Trigger: Manual
        EOF
        
        # 创建压缩包
        7z a -t7z -mx=9 ${PKG_DIR}.7z ${PKG_DIR}/
        zip -r ${PKG_DIR}.zip ${PKG_DIR}/
        tar -cJf ${PKG_DIR}.tar.xz ${PKG_DIR}/
        
        # 校验和
        sha256sum ${PKG_DIR}.7z ${PKG_DIR}.zip ${PKG_DIR}.tar.xz > SHA256SUMS.txt
        
        echo "打包完成："
        ls -lh ${PKG_DIR}.*
        
    - name: 发布到 GitHub Releases
      run: |
        VER="${{ steps.package.outputs.VER }}"
        
        # 检查 release 是否已存在
        if gh release view "$VER" &>/dev/null; then
          echo "Release $VER 已存在，将更新文件"
          gh release upload "$VER" *.7z *.zip *.tar.xz SHA256SUMS.txt --clobber
        else
          echo "创建新 Release: $VER"
          gh release create "$VER" \
            --title "GRUB4DOS $VER" \
            --notes "手动构建版本
            - 分支: ${{ github.event.inputs.branch }}
            - 构建时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
            - 提交: ${{ github.sha }}" \
            *.7z *.zip *.tar.xz SHA256SUMS.txt
        fi
      env:
        GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

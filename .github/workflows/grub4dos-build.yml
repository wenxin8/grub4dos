name: grub4dos-build(手动可以，push不行)

on:
  # 自动触发：代码推送
  push:
    branches: [ "master","efi","0.4.6a" ]
    tags: [ "v*" ]
  
  # 自动触发：PR 事件
  pull_request:
    types: [ opened , synchronize , reopened ]
  
  # 手动触发（关键！）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（可选，留空自动生成）'
        required: false
        default: ''
      use_qemu:
        description: '使用 QEMU 测试'
        type: boolean
        default: true

jobs:
  build-push:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-22.04
    environment:
      name: PAGES
    steps:
    - name: 安装依赖
      run: |
        sudo apt-get update
        sudo apt-get install -y p7zip-full zip
        
    - name: 检出代码
      uses: actions/checkout@v4
      with:
        fetch-depth: 10
        
    - name: 检出 iPXE (0.4.6分支)
      if: ${{ contains(github.ref, '0.4.6') }}
      uses: actions/checkout@v4
      with:
        repository: ipxe/ipxe
        path: ipxe
        ref: v1.21.1

    - name: Build iPXE (0.4.6分支)
      if: ${{ contains(github.ref, '0.4.6') }}
      working-directory: ipxe/src
      env:
        NO_WERROR: 1                    # iPXE 特定变量
        CFLAGS: "-Wno-maybe-uninitialized"
      run: |
        make -j$(nproc) bin/ipxe.lkrn bin/ipxe.usb NO_WERROR=1  #禁用警告

    - name: 编译 GRUB4DOS（带 QEMU 测试）
      id: build_with_qemu
      continue-on-error: true
      uses: yaya2007/grub4dos-build@main
      with:
        useQemu: ${{ github.event.inputs.use_qemu || '1' }}   #pursh触发时efi编译用Qemu出错，不用Qemu就正常
                                                              #手动触发时可以用Qemu没问题
    - name: QEMU 失败时清理并重新编译（禁用 QEMU）
      if: steps.build_with_qemu.outcome == 'failure'
      run: |
        echo "⚠️ QEMU 测试失败，清理环境并重新编译..."
        # 清理临时文件
        rm -rf /tmp/grub4dos-temp
        rm -rf grubutils
        rm -f *.7z *.zip *.tar.xz SHA256SUMS.txt 2>/dev/null || true
        
    - name: 编译 GRUB4DOS（禁用 QEMU）
      if: steps.build_with_qemu.outcome == 'failure'
      uses: yaya2007/grub4dos-build@main
      with:
        useQemu: false  # 禁用 QEMU
    
    - name: 生成版本号
      id: version
      run: |
        # 确定版本号
        if [ -n "${{ github.event.inputs.version }}" ]; then
          VER="${{ github.event.inputs.version }}"
        elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VER=${GITHUB_REF#refs/tags/}
        else
          VER="0.4.6a-$(date +%Y%m%d)-${GITHUB_SHA:0:8}"
        fi
        
        echo "VER=$VER" >> $GITHUB_OUTPUT
        echo "GRUB4DOS_VER=$VER" >> $GITHUB_ENV
        
    - name: 列出所有压缩包
      run: ls -lh *.7z *.zip *.tar.xz 2>/dev/null || true
        
    - name: 上传 Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: grub4dos-${{ steps.version.outputs.VER }}
        path: |
          *.7z
          *.zip
          *.tar.xz
        if-no-files-found: error
        retention-days: 90